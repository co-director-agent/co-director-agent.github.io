<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dataset Hub | GenAD-Bench</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; overflow-x: hidden; }
        .category-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .category-card:hover { transform: scale(1.02); z-index: 10; }
        .results-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        [x-cloak] { display: none !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body x-data="dynamicBrowser()" @keydown.escape.window="closeAll()" class="min-h-screen">
    
    <!-- Background Gradient -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_50%_50%,rgba(30,58,138,0.2),rgba(15,23,42,1))] -z-10"></div>

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 glass border-b border-white/10 px-6 py-4 flex items-center justify-between transition-all duration-500"
        :class="view === 'results' ? 'bg-slate-900/90' : 'bg-transparent'">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-white/50 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div @click="reset()" class="cursor-pointer">
                <h1 class="text-xl font-bold tracking-tight">GenAD-Bench <span class="text-blue-500">Hub</span></h1>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div x-show="view === 'results'" x-transition class="hidden md:flex items-center gap-2 overflow-x-auto max-w-md scrollbar-hide">
                <template x-for="cat in categories" :key="cat.name">
                    <button @click="selectCategory(cat.name)" 
                        class="px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-all"
                        :class="activeCategory === cat.name ? 'bg-blue-600 text-white' : 'text-white/40 hover:text-white/70'">
                        <span x-text="cat.name"></span>
                    </button>
                </template>
            </div>
            
            <div class="relative w-64">
                <input type="text" x-model="searchQuery" @input="view = 'results'; if(!searchQuery && activeCategory === 'All') reset();" 
                    placeholder="Search dataset..." 
                    class="w-full bg-white/5 border border-white/10 rounded-full pl-10 pr-4 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                <div class="absolute left-3 top-2 text-white/30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hub View: Category Grid -->
    <div x-show="view === 'hub'" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="max-w-7xl mx-auto px-6 py-12">
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
            <template x-for="cat in categories" :key="cat.name">
                <div @click="selectCategory(cat.name)" 
                    class="category-card relative aspect-[3/4] rounded-2xl overflow-hidden cursor-pointer group shadow-2xl border border-white/5">
                    <img :src="cat.image" class="absolute inset-0 w-full h-full object-cover group-hover:grayscale-0 transition-all duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent"></div>
                    <div class="absolute inset-0 p-4 flex flex-col justify-end">
                        <span class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-1" x-text="cat.count + ' Products'"></span>
                        <h3 class="text-lg font-bold text-white group-hover:text-blue-300 transition-colors" x-text="cat.name"></h3>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Results View -->
    <div x-show="view === 'results'" class="results-fade-in max-w-7xl mx-auto px-6 py-8" x-cloak>
        <div class="flex items-center justify-between mb-8 border-b border-white/5 pb-6">
            <div>
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <span class="text-white/40" @click="reset()" class="cursor-pointer hover:text-white">GenAD-Bench</span>
                    <span class="text-white/20">/</span>
                    <span x-text="activeCategory"></span>
                </h2>
                <p class="text-white/40 text-sm mt-1">Found <span class="text-white/80 font-mono" x-text="Object.keys(groupedProducts).length"></span> brands in this segment.</p>
            </div>
            <button @click="reset()" class="text-xs uppercase tracking-widest font-bold text-blue-500 hover:text-blue-400">Back to Hub</button>
        </div>

        <div class="space-y-16">
            <template x-for="(products, brand) in groupedProducts" :key="brand">
                <div class="space-y-6">
                    <div class="flex items-center gap-6">
                        <div class="bg-white p-3 rounded-2xl border border-white/10 shadow-lg">
                            <img :src="'assets/genad_bench/' + String(products[0].id).padStart(2, '0') + '_logo.jpg'" 
                                class="h-10 w-auto object-contain" :alt="brand">
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold text-white" x-text="brand"></h3>
                            <p class="text-blue-500 text-xs font-bold uppercase tracking-widest" x-text="products[0].industry"></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <template x-for="product in products" :key="product.id">
                            <div @click="openModal(product)" class="group cursor-pointer">
                                <div class="aspect-video glass rounded-2xl overflow-hidden mb-4 relative border border-white/5 group-hover:border-blue-500/50 transition-all shadow-xl">
                                    <img :src="'assets/genad_bench/' + String(product.id).padStart(2, '0') + '_stereotypical_with_logo.jpg'" 
                                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                                    <div class="absolute inset-0 bg-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <div class="glass px-4 py-2 rounded-full text-xs font-bold">Compare Strategies</div>
                                    </div>
                                </div>
                                <h4 class="font-bold text-white group-hover:text-blue-400 transition-colors" x-text="product.product"></h4>
                                <p class="text-white/40 text-xs mt-1 line-clamp-2" x-text="product.description"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Enhanced Modal -->
    <div x-show="modalOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8" x-cloak>
        <div @click="modalOpen = false" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm transition-opacity" x-show="modalOpen" x-transition.opacity></div>
        
        <div x-show="modalOpen" 
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95 translate-y-8"
            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
            class="glass w-full max-w-6xl max-h-full overflow-y-auto rounded-3xl relative shadow-2xl border border-white/10">
            
            <button @click="modalOpen = false" class="absolute top-6 right-6 z-10 p-2 rounded-full bg-white/5 hover:bg-white/10 transition-colors border border-white/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="p-8 md:p-12">
                <div class="flex flex-col md:flex-row gap-8 items-start mb-12">
                    <div class="bg-white p-4 rounded-2xl border border-white/10 shadow-xl self-start">
                        <img :src="'assets/genad_bench/' + String(selectedProduct?.id).padStart(2, '0') + '_logo.jpg'" 
                            class="h-12 w-auto object-contain" :alt="selectedProduct?.brand">
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 text-[10px] font-bold uppercase tracking-widest border border-blue-500/20" x-text="selectedProduct?.industry"></span>
                        </div>
                        <h2 class="text-4xl font-extrabold mb-4" x-text="selectedProduct?.product"></h2>
                        <p class="text-white/60 text-lg leading-relaxed max-w-3xl" x-text="selectedProduct?.description"></p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <!-- Stereotypical -->
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-[0.3em] text-emerald-400">Stereotypical</h3>
                        </div>
                        <div class="glass p-6 rounded-2xl border-l-4 border-l-emerald-500/50 italic text-sm text-white/80 leading-relaxed" x-text="selectedProduct?.prompts[0].prompt"></div>
                        <div class="rounded-3xl overflow-hidden shadow-2xl border border-white/5 aspect-video bg-white/5">
                            <img :src="'assets/genad_bench/' + String(selectedProduct?.id).padStart(2, '0') + '_stereotypical_with_logo.jpg'" 
                                class="w-full h-full object-cover">
                        </div>
                    </div>

                    <!-- Unconventional -->
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-[0.3em] text-purple-400">Unconventional</h3>
                        </div>
                        <div class="glass p-6 rounded-2xl border-l-4 border-l-purple-500/50 italic text-sm text-white/80 leading-relaxed" x-text="selectedProduct?.prompts[1].prompt"></div>
                        <div class="rounded-3xl overflow-hidden shadow-2xl border border-white/5 aspect-video bg-white/5">
                            <img :src="'assets/genad_bench/' + String(selectedProduct?.id).padStart(2, '0') + '_unconventional_with_logo.jpg'" 
                                class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        function dynamicBrowser() {
            return {
                view: 'hub',
                activeCategory: 'All',
                searchQuery: '',
                modalOpen: false,
                selectedProduct: null,
                categories: categories,
                
                get groupedProducts() {
                    const filtered = dataset.filter(product => {
                        const matchesCategory = this.activeCategory === 'All' || product.category === this.activeCategory;
                        const matchesSearch = product.brand.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                           product.product.toLowerCase().includes(this.searchQuery.toLowerCase());
                        return matchesCategory && matchesSearch;
                    });

                    const groups = {};
                    filtered.forEach(p => {
                        if (!groups[p.brand]) groups[p.brand] = [];
                        groups[p.brand].push(p);
                    });
                    return groups;
                },

                selectCategory(cat) {
                    this.activeCategory = cat;
                    this.view = 'results';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                reset() {
                    this.view = 'hub';
                    this.activeCategory = 'All';
                    this.searchQuery = '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                openModal(product) {
                    this.selectedProduct = product;
                    this.modalOpen = true;
                    document.body.style.overflow = 'hidden';
                },

                closeAll() {
                    if (this.modalOpen) {
                        this.modalOpen = false;
                    } else if (this.view === 'results' && !this.searchQuery) {
                        this.reset();
                    }
                },

                init() {
                    this.$watch('modalOpen', value => {
                        if (!value) document.body.style.overflow = 'auto';
                    });
                }
            }
